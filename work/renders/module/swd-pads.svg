<text x="860" y="458.0" font-size="12">Cutout 8.0 x 5.5 mm; carrier 1.6 mm thick. Plug body fit: UNKNOWN until tried.</text>
<text x="120" y="520" font-size="15" font-weight="600">J2 pads (module netlist)</text>
<text x="120" y="544" font-size="13">pad 1: 3.3 V (target sense)</text>
<text x="120" y="564" font-size="13">pad 2: SWDIO</text>
<text x="120" y="584" font-size="13">pad 3: nRESET</text>
<text x="120" y="604" font-size="13">pad 4: SWCLK</text>
<text x="120" y="624" font-size="13">pad 5: GND</text>
<text x="120" y="644" font-size="13">pad 6: SWO: not connected</text>
<text x="420" y="544" font-size="13">Black dots: the plug's three locating holes (2 on one side, 1 on the other),</text>
<text x="420" y="564" font-size="13">so a TC2030 "-NL" plug only fits one way round.</text>
<text x="420" y="584" font-size="13">Pinout matches Tag-Connect's ARM Cortex mapping (FROM MEMORY): TC2030-CTX-NL cable.</text>
<text x="420" y="604" font-size="13">Pad 1 is the target-voltage sense: power the board from its own supply, not the probe.</text>
